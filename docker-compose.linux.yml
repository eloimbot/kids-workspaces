services:
  kids-workspaces:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: kids-workspaces
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      APP_PROTOCOL: "https"
      APP_HOST: "127.0.0.1"
      SESSION_PROXY_HOST: "host.docker.internal"
      PUBLIC_BASE_URL: "https://workspaces.example.com"
      HTTPS_ENABLED: "false"
      HTTPS_PORT: "3443"
      HTTPS_KEY_PATH: "/certs/server.key"
      HTTPS_CERT_PATH: "/certs/server.crt"
      DOCKER_USE_SUDO: "false"
      DOCKER_SUDO_NON_INTERACTIVE: "true"
    ports:
      - "3000:3000"
      - "3443:3443"
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      - ./certs:/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: kids-workspaces-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN}"
    depends_on:
      - kids-workspaces
